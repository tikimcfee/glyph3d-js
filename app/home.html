<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>glyph3d</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #050608;
            overflow: hidden;
            color: #d8d8e0;
            font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
        }
        #home-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }
        /* Loading curtain — covers the canvas while atlas + HarfBuzz + Slug warm up.
           Removed by HomeShell once the welcome cluster is laid out. */
        #boot-curtain {
            position: fixed;
            inset: 0;
            background: #050608;
            color: #5a5a70;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            z-index: 50;
            transition: opacity 360ms ease;
        }
        #boot-curtain.fade { opacity: 0; pointer-events: none; }
        #boot-curtain .dot { color: #7ad7a0; }
    </style>
</head>
<body>
    <canvas id="home-canvas"></canvas>

    <div id="boot-curtain">
        warming up the glyph engine<span class="dot">…</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
            "@glyph3d/core/": "/packages/glyph3d-core/src/"
        }
    }
    </script>
    <script>
        // Standalone livereload watcher — fires BEFORE the HomeShell
        // module is loaded so even a boot-failure-stuck page recovers
        // when the source is edited. Self-contained: no imports, no
        // deps on HomeShell. Reconnects silently if the relay restarts.
        (function bootLivereload() {
            const port = location.port || '8080';
            let ws, retry = 0;
            function connect() {
                try { ws = new WebSocket(`ws://${location.hostname}:${port}/`); }
                catch { schedule(); return; }
                ws.onopen = () => {
                    retry = 0;
                    ws.send('DISPLAY');
                };
                ws.onmessage = (ev) => {
                    let m; try { m = JSON.parse(ev.data); } catch { return; }
                    if (m?.method === 'fs/didChange' && m?.params?.event === 'change') {
                        location.reload();
                    }
                };
                ws.onclose = schedule;
                ws.onerror = () => { try { ws.close(); } catch {} };
            }
            function schedule() {
                // Only the boot-failed path needs this listener — once
                // HomeShell loads it installs its own WebSocketBridge
                // which DISPLAY-registers and gets fs/didChange. Don't
                // reconnect aggressively from here.
                retry++;
                if (retry > 6) return;
                setTimeout(connect, 1500 + retry * 500);
            }
            // Close our connection once HomeShell takes over (it can't
            // share the DISPLAY slot with us).
            window.addEventListener('home:bridge-ready', () => {
                try { ws?.close(); } catch {}
            }, { once: true });
            connect();
        })();
    </script>
    <script type="module">
        // Top-level await in a module delays the document's `load` event
        // until init resolves — useful for snapshot tooling that fires on
        // load, and harmless in the normal interactive case.
        import { HomeShell } from './HomeShell.js';

        const canvas = document.getElementById('home-canvas');
        const curtain = document.getElementById('boot-curtain');

        const shell = new HomeShell({ canvas });
        window.home = shell;  // debug access

        try {
            await shell.init();
            curtain.classList.add('fade');
            setTimeout(() => curtain.remove(), 400);
        } catch (err) {
            console.error('[home] init failed:', err);
            curtain.textContent = 'boot failed: ' + (err?.message || String(err));
            // Mirror to server log via a one-shot WS ping so headless runs
            // surface the failure too.
            try {
                const port = window.location.port || '8080';
                const ws = new WebSocket(`ws://${window.location.hostname}:${port}/`);
                ws.onopen = () => {
                    ws.send('DISPLAY');
                    ws.send(JSON.stringify({
                        event: 'browser.log',
                        level: 'error',
                        text: 'home.boot-failed: ' + (err?.message || String(err)),
                    }));
                    setTimeout(() => ws.close(), 250);
                };
            } catch {}
        }
    </script>
</body>
</html>
