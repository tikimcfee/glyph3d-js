# The terminal daemon, one binary in two roles: the holder (crates/g3d-hold: the shells, their
# PTY fds, the store) and the brain (one libghostty-vt Terminal per terminal on its own owner
# thread, and the Unix-socket server). Unix only.
[package]
name = "g3d-termd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "g3d-termd"
path = "src/main.rs"

[dependencies]
g3d-wire.workspace = true
g3d.workspace = true
g3d-hold.workspace = true
lz4_flex.workspace = true
crc32fast.workspace = true
libghostty-vt.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix.workspace = true
tokio.workspace = true
clap.workspace = true
libc = "0.2.177"
