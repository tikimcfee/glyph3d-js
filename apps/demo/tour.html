<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glyph3d — tour</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #0e0c08; overflow: hidden; }
      #phase {
        position: fixed; left: 14px; bottom: 12px; z-index: 10;
        font: 11px/1.5 'IBM Plex Mono', ui-monospace, monospace;
        letter-spacing: 0.14em; text-transform: uppercase; color: #a8a072;
        pointer-events: none; text-shadow: 0 0 6px #0e0c08;
      }
      #descriptor {
        position: fixed; right: 16px; top: 14px; z-index: 10; text-align: right;
        font: 15px/1.5 'IBM Plex Mono', ui-monospace, monospace;
        letter-spacing: 0.05em; color: #e6dec9; pointer-events: none; white-space: nowrap;
        background: rgba(14, 12, 8, 0.72); padding: 5px 16px; border-radius: 5px;
        transition: opacity 180ms;
      }
      /* no-WebGPU fallback — never a blank box; matches glyph3d.dev tones */
      .nogpu {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; text-align: center;
        font: 14px/1.6 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #a39a7f;
      }
      .nogpu a { color: #a8a072; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="phase"></div>
    <div id="descriptor"></div>
    <script type="module" src="/tour.jsx"></script>
  </body>
</html>
