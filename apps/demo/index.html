<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glyph3d — showcase</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #0e0c08; overflow: hidden; }
      /* no-WebGPU fallback — never a blank box; matches glyph3d.dev tones */
      .nogpu {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; text-align: center;
        font: 14px/1.6 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #a39a7f;
      }
      .nogpu a { color: #a8a072; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
