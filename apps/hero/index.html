<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glyph3d — live demo</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #0e0c08; overflow: hidden; }
      /* espresso & sage, matched to glyph3d.dev so the iframe is seamless */
      #hint {
        position: fixed; left: 12px; bottom: 11px; z-index: 10;
        font: 11px/1.5 'IBM Plex Mono', ui-monospace, Menlo, monospace;
        letter-spacing: 0.08em; color: #a39a7f; pointer-events: none;
        text-shadow: 0 0 6px #0e0c08;
      }
      #hint b { color: #a8a072; font-weight: 400; }
      .nogpu {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; text-align: center;
        font: 14px/1.6 'IBM Plex Mono', ui-monospace, Menlo, monospace; color: #a39a7f;
      }
      .nogpu a { color: #a8a072; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="hint"><b>drag</b> orbit/pan · <b>wheel</b> zoom · <b>type</b> to fill</div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
