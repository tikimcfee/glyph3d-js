<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Render Test - glyph3d-js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
            touch-action: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #panel {
            position: fixed;
            top: 0;
            left: 0;
            background: rgba(10, 10, 15, 0.94);
            border-right: 1px solid #333;
            border-bottom: 1px solid #333;
            border-radius: 0 0 6px 0;
            padding: 12px 14px;
            font-size: 12px;
            z-index: 100;
            min-width: 260px;
            max-width: min(360px, 85vw);
            max-height: 100vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        #panel.collapsed {
            transform: translateX(calc(-100% - 12px));
            opacity: 0;
            pointer-events: none;
        }

        #panel-toggle {
            position: fixed;
            top: 12px;
            left: 12px;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: rgba(10, 10, 15, 0.92);
            border: 1px solid #333;
            color: #00ff88;
            font-size: 18px;
            cursor: pointer;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.25s ease;
        }

        #panel-toggle.hidden {
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            #panel {
                font-size: 11px;
                padding: 10px;
                min-width: 0;
                max-width: calc(100vw - 60px);
            }
            #controls-help { display: none; }
        }

        #panel h1 {
            font-size: 15px;
            color: #00ff88;
            margin-bottom: 4px;
        }

        #panel .subtitle {
            color: #666;
            font-size: 10px;
            margin-bottom: 12px;
        }

        .section {
            border-top: 1px solid #222;
            padding-top: 10px;
            margin-top: 10px;
        }

        .section h2 {
            font-size: 12px;
            color: #ffaa33;
            margin-bottom: 6px;
        }

        .test-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            line-height: 1.5;
            gap: 8px;
        }

        .test-label {
            color: #aaa;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .test-status {
            font-weight: bold;
            flex-shrink: 0;
        }

        .test-status.pass { color: #00ff88; }
        .test-status.fail { color: #ff4444; }
        .test-status.pending { color: #555; }
        .test-status.running { color: #ffaa33; }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 14px;
            background: #222;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover, button:active {
            background: #333;
            border-color: #00ff88;
            color: #fff;
        }

        button:disabled { opacity: 0.4; cursor: not-allowed; }

        button.primary {
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
            color: #000;
            border-color: transparent;
            font-weight: bold;
        }

        #log {
            margin-top: 10px;
            background: #111;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 10px;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.5;
            color: #888;
            word-break: break-all;
            -webkit-overflow-scrolling: touch;
        }

        #log .log-ok { color: #00ff88; }
        #log .log-err { color: #ff4444; }
        #log .log-info { color: #ffaa33; }

        #controls-help {
            position: fixed;
            bottom: 8px;
            right: 8px;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 10px;
            line-height: 1.7;
            z-index: 100;
        }

        @media (max-width: 600px) {
            #controls-help { display: none; }
        }

        #controls-help h3 {
            color: #ffaa33;
            font-size: 11px;
            margin-bottom: 2px;
        }

        .key {
            display: inline-block;
            background: #333;
            padding: 1px 5px;
            border-radius: 3px;
            min-width: 18px;
            text-align: center;
            margin-right: 4px;
            font-size: 9px;
        }

        .summary {
            margin-top: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .summary.all-pass { background: #00ff8818; color: #00ff88; }
        .summary.has-fail { background: #ff444418; color: #ff4444; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <button id="panel-toggle" class="hidden" aria-label="Show panel">&#9776;</button>

    <div id="panel">
        <div style="display:flex; align-items:center; justify-content:space-between;">
            <h1>Render Test</h1>
            <button id="panel-collapse" style="background:none; border:none; color:#666; font-size:18px; cursor:pointer; padding:0 4px;" aria-label="Collapse panel">&times;</button>
        </div>
        <p class="subtitle">Sync &amp; async path verification</p>

        <div class="section">
            <h2>Tests</h2>
            <div id="test-results"></div>
            <div id="summary"></div>
        </div>

        <div class="btn-row">
            <button class="primary" id="run-btn">Run All Tests</button>
            <button id="clear-btn">Clear Scene</button>
            <button id="download-logs-btn">Download Logs</button>
            <button id="toggle-panel-btn">Collapse</button>
        </div>

        <div class="section" id="log-section">
            <h2>Log</h2>
            <div id="log"></div>
        </div>
    </div>

    <div id="controls-help">
        <h3>Navigation</h3>
        <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>Move</div>
        <div><span class="key">Space</span>Up <span class="key">Shift</span>Down</div>
        <div><span class="key">DblClick</span>FPS mode</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import {
            GlyphAtlas,
            GlyphRenderer,
            GlyphCollection,
            buildBatchBuffers,
            logCapture,
            createLogger,
        } from '../../src/index.js';

        // Start log capture immediately so all test output is recorded
        logCapture.start();

        // Create a logger for test output so it flows into the capture
        const testLog = createLogger('render-test');

        // ============================================================
        // TEST FRAMEWORK
        // ============================================================

        const testResults = document.getElementById('test-results');
        const summaryEl = document.getElementById('summary');
        const logEl = document.getElementById('log');
        const logSection = document.getElementById('log-section');

        const tests = [];
        let atlas = null;
        let panelCollapsed = false;

        function defineTest(name, fn) {
            tests.push({ name, fn, status: 'pending' });
        }

        function renderTestList() {
            testResults.innerHTML = tests.map((t, i) => `
                <div class="test-row">
                    <span class="test-label">${t.name}</span>
                    <span class="test-status ${t.status}" id="ts-${i}">
                        ${statusText(t.status)}
                    </span>
                </div>
            `).join('');
        }

        function statusText(s) {
            return s === 'pass' ? 'PASS' : s === 'fail' ? 'FAIL' : s === 'running' ? '...' : '--';
        }

        function updateTestStatus(index, status) {
            tests[index].status = status;
            const el = document.getElementById(`ts-${index}`);
            if (el) { el.className = `test-status ${status}`; el.textContent = statusText(status); }
        }

        function log(msg, cls = '') {
            const line = document.createElement('div');
            if (cls) line.className = `log-${cls}`;
            line.textContent = msg;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;

            // Also emit through Logger so it appears in log captures
            if (cls === 'err') testLog.error(msg);
            else if (cls === 'info') testLog.warn(msg);
            else if (cls === 'ok') testLog.info(msg);
            else testLog.debug(msg);
        }

        function assert(condition, msg) {
            if (!condition) throw new Error(msg);
        }

        // Global error listener to catch errors from outside test scope (e.g. Three.js render loop)
        window.addEventListener('error', (evt) => {
            const msg = `[GLOBAL ERROR] ${evt.message} at ${evt.filename}:${evt.lineno}:${evt.colno}`;
            log(msg, 'err');
            console.error('[GLOBAL ERROR]', evt.message, evt.filename, evt.lineno, evt.colno, evt.error);
        });

        // Panel collapse toggle
        document.getElementById('toggle-panel-btn').addEventListener('click', () => {
            panelCollapsed = !panelCollapsed;
            logSection.style.display = panelCollapsed ? 'none' : '';
            document.getElementById('toggle-panel-btn').textContent = panelCollapsed ? 'Expand' : 'Collapse';
        });

        // ============================================================
        // THREE.JS SETUP
        // ============================================================

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 30);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const grid = new THREE.GridHelper(200, 40, 0x222233, 0x111122);
        grid.rotation.x = Math.PI / 2;
        grid.position.z = -5;
        scene.add(grid);

        const sceneObjects = [];
        function trackObject(obj) { sceneObjects.push(obj); }
        function clearScene() {
            for (const obj of sceneObjects) {
                if (obj.dispose) obj.dispose();
                else if (obj.parent) obj.parent.remove(obj);
            }
            sceneObjects.length = 0;
        }

        // ============================================================
        // CAMERA: keyboard + touch
        // ============================================================

        const keys = {};
        let isPointerLocked = false;
        let pitch = 0, yaw = 0;

        document.addEventListener('keydown', e => { keys[e.code] = true; });
        document.addEventListener('keyup', e => { keys[e.code] = false; });

        canvas.addEventListener('dblclick', () => canvas.requestPointerLock());
        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === canvas;
        });
        document.addEventListener('mousemove', e => {
            if (!isPointerLocked) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        });

        // Touch controls: single-finger drag to orbit, two-finger to pan/zoom
        let touchStart = null;
        let pinchStart = 0;
        canvas.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                pinchStart = Math.hypot(dx, dy);
            }
        }, { passive: true });
        canvas.addEventListener('touchmove', e => {
            if (e.touches.length === 1 && touchStart) {
                const dx = e.touches[0].clientX - touchStart.x;
                const dy = e.touches[0].clientY - touchStart.y;
                yaw -= dx * 0.004;
                pitch -= dy * 0.004;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            } else if (e.touches.length === 2 && pinchStart > 0) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const pinchNow = Math.hypot(dx, dy);
                const delta = (pinchNow - pinchStart) * 0.1;
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                camera.position.addScaledVector(dir, delta);
                pinchStart = pinchNow;
            }
        }, { passive: true });
        canvas.addEventListener('touchend', () => { touchStart = null; pinchStart = 0; }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function updateCamera(dt) {
            const dir = new THREE.Vector3();
            if (keys['KeyW']) dir.z -= 1;
            if (keys['KeyS']) dir.z += 1;
            if (keys['KeyA']) dir.x -= 1;
            if (keys['KeyD']) dir.x += 1;
            if (keys['Space']) dir.y += 1;
            if (keys['ShiftLeft'] || keys['ShiftRight']) dir.y -= 1;
            if (dir.length() > 0) {
                dir.normalize().applyQuaternion(camera.quaternion).multiplyScalar(80 * dt);
                camera.position.add(dir);
            }
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        }

        // ============================================================
        // TEST DEFINITIONS
        // ============================================================

        // -- 1: Sync single render --
        defineTest('Sync: render + getText', async () => {
            const r = new GlyphRenderer(scene, atlas, { defaultColor: { r: 0, g: 1, b: 0.5 } });
            trackObject(r);

            const id = r.render('Hello sync!', { x: -20, y: 10, z: 0 });
            const entry = r.getText(id);

            assert(entry !== null, 'getText returned null');
            assert(entry.glyphs.length === 10, `expected 10 glyphs, got ${entry.glyphs.length}`);

            log(`  id=${id}, ${entry.glyphs.length} glyphs`, 'ok');
        });

        // -- 2: Sync batch + updateColor --
        defineTest('Sync: batch + updateColor', async () => {
            const r = new GlyphRenderer(scene, atlas, { defaultColor: { r: 0.4, g: 0.4, b: 0.5 } });
            trackObject(r);

            const ids = r.renderBatch([
                { text: 'apple',  position: { x: -20, y: 6, z: 0 } },
                { text: 'banana', position: { x: -10, y: 6, z: 0 } },
                { text: 'cherry', position: { x:   0, y: 6, z: 0 } },
            ]);
            assert(ids.length === 3, `expected 3 ids, got ${ids.length}`);

            r.updateColor(ids[1], { r: 1.0, g: 0.6, b: 0.0 });
            const g0 = r.getText(ids[1]).glyphs[0];
            assert(g0.color.r === 1.0, `color not updated: r=${g0.color.r}`);

            log(`  3 words, color updated on id=${ids[1]}`, 'ok');
        });

        // -- 3: Sync updatePosition --
        defineTest('Sync: updatePosition', async () => {
            const r = new GlyphRenderer(scene, atlas, { defaultColor: { r: 0.8, g: 0.2, b: 0.8 } });
            trackObject(r);

            const id = r.render('movable', { x: -20, y: 2, z: 0 });
            const before = r.getText(id).glyphs[0].position.x;
            r.updatePosition(id, { x: -10, y: 2, z: 0 });
            const after = r.getText(id).glyphs[0].position.x;

            assert(after !== before, `position unchanged: ${before}`);
            log(`  x: ${before.toFixed(2)} -> ${after.toFixed(2)}`, 'ok');
        });

        // -- 4: Main-thread buildBatchBuffers + applyPrebuiltBuffers (no workers) --
        // This isolates the metadata flow from worker transport issues.
        defineTest('Direct: buildBatchBuffers + apply', async () => {
            const r = new GlyphRenderer(scene, atlas, {
                defaultColor: { r: 0.6, g: 0.9, b: 0.3 },
                skipPrealloc: true
            });
            trackObject(r);

            const items = [
                { text: 'direct-a', position: { x: -20, y: -2, z: 0 }, color: { r: 0.6, g: 0.9, b: 0.3 }, scale: 1.0 },
                { text: 'direct-b', position: { x:  -5, y: -2, z: 0 }, color: { r: 0.6, g: 0.9, b: 0.3 }, scale: 1.0 },
            ];

            // Build buffers on main thread (same code the worker uses)
            const uvMap = {};
            for (const [code, uv] of atlas.uvMap) { uvMap[code] = uv; }
            const metrics = {
                charWidth: atlas.getCharSize().width,
                charHeight: atlas.getCharSize().height,
                letterSpacing: atlas.getCharSize().width * 0.05,
                lineSpacing: atlas.getCharSize().height * 1.2,
            };
            const buffers = buildBatchBuffers(items, { metrics, uvMap, defaultColor: { r: 0.6, g: 0.9, b: 0.3 } });

            log(`  buffers: count=${buffers.count}, hasItemMeta=${!!buffers.itemMeta}, metaLen=${buffers.itemMeta?.length}`, 'info');
            assert(buffers.itemMeta, 'buildBatchBuffers did not return itemMeta');
            assert(buffers.itemMeta.length === 2, `expected 2 itemMeta, got ${buffers.itemMeta.length}`);
            assert(buffers.itemMeta[0].glyphCount > 0, `item 0 has 0 glyphs`);

            // Apply to renderer with metadata
            const rendererIds = r.applyPrebuiltBuffers(buffers, items);
            assert(rendererIds !== null, 'applyPrebuiltBuffers returned null (no itemMeta?)');
            assert(rendererIds.length === 2, `expected 2 renderer IDs, got ${rendererIds.length}`);

            // Verify getText works
            const entry = r.getText(rendererIds[0]);
            assert(entry !== null, 'getText returned null after applyPrebuiltBuffers');
            assert(entry.glyphs.length > 0, `no glyphs: ${entry.glyphs.length}`);

            // Verify updateColor works
            r.updateColor(rendererIds[0], { r: 1, g: 0, b: 0 });
            const updated = r.getText(rendererIds[0]).glyphs[0];
            assert(updated.color.r === 1, `color not updated: r=${updated.color.r}`);

            log(`  ids=${rendererIds}, glyphs=${entry.glyphs.length}, color update OK`, 'ok');
        });

        // -- 5: Async flushAsync + getText --
        defineTest('Async: flushAsync + getText', async () => {
            const coll = new GlyphCollection(scene, atlas, {
                defaultColor: { r: 0.2, g: 0.6, b: 1.0 },
                worldScale: 0.025
            });
            trackObject(coll);

            const id1 = coll.addText('async hello', { x: -20, y: -6, z: 0 });
            const id2 = coll.addText('async world', { x: -5, y: -6, z: 0 });

            await coll.flushAsync();

            // Diagnostic: check internal state
            const hasRenderer = !!coll.getRenderer();
            const hasIdMap = coll._idMap.has(id1);
            const committedEntry = coll._committedTexts.get(id1);
            const rendererId = coll._idMap.get(id1);

            log(`  renderer=${hasRenderer}, idMap=${hasIdMap}, rendererId=${rendererId}, committed=${!!committedEntry}`, 'info');

            if (committedEntry) {
                log(`  committed.rendererId=${committedEntry.rendererId}`, 'info');
            }

            if (hasRenderer && rendererId !== undefined) {
                const rendererEntry = coll.getRenderer().getText(rendererId);
                log(`  rendererEntry=${!!rendererEntry}, glyphs=${rendererEntry?.glyphs?.length ?? 'N/A'}`, 'info');
            }

            const entry = coll.getText(id1);
            assert(entry !== null, 'getText returned null after flushAsync');
            assert(!entry.pending, 'entry still marked as pending');
            assert(entry.glyphs.length > 0, `no glyphs: got ${entry.glyphs.length} (rendererId=${rendererId}, committed.rendererId=${committedEntry?.rendererId})`);

            log(`  id1 has ${entry.glyphs.length} glyphs`, 'ok');
        });

        // -- 6: Async updateColor post-flush --
        defineTest('Async: updateColor post-flush', async () => {
            const coll = new GlyphCollection(scene, atlas, {
                defaultColor: { r: 0.3, g: 0.3, b: 0.3 },
                worldScale: 0.025
            });
            trackObject(coll);

            const ids = coll.addTexts([
                { text: 'red',   position: { x: -20, y: -10, z: 0 } },
                { text: 'green', position: { x: -12, y: -10, z: 0 } },
                { text: 'blue',  position: { x:  -4, y: -10, z: 0 } },
            ]);

            await coll.flushAsync();

            // Check state before update
            const rendererId = coll._idMap.get(ids[0]);
            log(`  pre-update: idMap[${ids[0]}]=${rendererId}`, 'info');
            assert(rendererId !== undefined, `no rendererId for ids[0]=${ids[0]}`);

            const preEntry = coll.getRenderer().getText(rendererId);
            assert(preEntry !== null, `renderer has no entry for rendererId=${rendererId}`);
            assert(preEntry.glyphs.length > 0, `no glyphs for rendererId=${rendererId}`);

            // Update colors
            coll.updateColor(ids[0], { r: 1, g: 0, b: 0 });
            coll.updateColor(ids[1], { r: 0, g: 1, b: 0 });
            coll.updateColor(ids[2], { r: 0, g: 0, b: 1 });
            coll.flush();

            const postEntry = coll.getRenderer().getText(rendererId);
            assert(postEntry.glyphs[0].color.r === 1, `color not updated: r=${postEntry.glyphs[0].color.r}`);

            log(`  3 colors updated after flushAsync`, 'ok');
        });

        // -- 7: Async updatePosition post-flush --
        defineTest('Async: updatePosition post-flush', async () => {
            const coll = new GlyphCollection(scene, atlas, {
                defaultColor: { r: 1.0, g: 0.8, b: 0.0 },
                worldScale: 0.025
            });
            trackObject(coll);

            const id = coll.addText('shift me', { x: -20, y: -14, z: 0 });
            await coll.flushAsync();

            const rendererId = coll._idMap.get(id);
            assert(rendererId !== undefined, `no rendererId for id=${id}`);

            const beforeEntry = coll.getRenderer().getText(rendererId);
            assert(beforeEntry !== null, `renderer entry null for rendererId=${rendererId}`);
            const beforeX = beforeEntry.glyphs[0].position.x;

            coll.updatePosition(id, { x: -5, y: -14, z: 0 });
            coll.flush();

            const afterX = coll.getRenderer().getText(rendererId).glyphs[0].position.x;
            assert(afterX !== beforeX, `position unchanged: ${beforeX}`);

            log(`  x: ${beforeX.toFixed(2)} -> ${afterX.toFixed(2)}`, 'ok');
        });

        // -- 8: Async batch 100 items --
        defineTest('Async: batch 100 items', async () => {
            const coll = new GlyphCollection(scene, atlas, {
                defaultColor: { r: 0.5, g: 0.5, b: 0.5 },
                worldScale: 0.025
            });
            trackObject(coll);

            const ids = [];
            for (let i = 0; i < 100; i++) {
                ids.push(coll.addText(`w${i}`, {
                    x: (i % 10) * 4 + 10,
                    y: -Math.floor(i / 10) * 1.5 + 10,
                    z: 0
                }));
            }

            await coll.flushAsync();

            let tracked = 0;
            let withGlyphs = 0;
            for (const id of ids) {
                const t = coll.getText(id);
                if (t && !t.pending) tracked++;
                if (t && t.glyphs && t.glyphs.length > 0) withGlyphs++;
            }

            assert(tracked === 100, `only ${tracked}/100 tracked`);
            assert(withGlyphs === 100, `only ${withGlyphs}/100 have glyphs`);

            // Color every 10th
            for (let i = 0; i < 100; i += 10) {
                coll.updateColor(ids[i], { r: 1, g: 0.3, b: 0.8 });
            }
            coll.flush();

            log(`  100 items: ${tracked} tracked, ${withGlyphs} with glyphs`, 'ok');
        });

        // -- 9: getBounds after async --
        defineTest('Async: getBounds', async () => {
            const coll = new GlyphCollection(scene, atlas, {
                defaultColor: { r: 0.6, g: 0.4, b: 0.8 },
                worldScale: 0.025
            });
            trackObject(coll);

            coll.addText('bounds test line one', { x: -20, y: -18, z: 0 });
            coll.addText('bounds test line two', { x: -20, y: -19.5, z: 0 });
            await coll.flushAsync();

            const bounds = coll.getBounds();
            assert(bounds !== null, 'bounds is null');
            assert(bounds.width > 0, `invalid width: ${bounds.width}`);
            assert(bounds.height > 0, `invalid height: ${bounds.height}`);

            log(`  bounds: ${bounds.width.toFixed(1)} x ${bounds.height.toFixed(1)}`, 'ok');
        });

        // -- 10: Depth ordering --
        defineTest('Depth: glyph-over-background', async () => {
            const bgGeo = new THREE.PlaneGeometry(15, 4);
            const bgMat = new THREE.MeshBasicMaterial({
                color: 0x1a1a3e, transparent: true, opacity: 0.85,
                side: THREE.DoubleSide, depthWrite: false
            });
            const bgMesh = new THREE.Mesh(bgGeo, bgMat);
            bgMesh.renderOrder = -1;
            bgMesh.position.set(-12, -22, -0.5);
            scene.add(bgMesh);
            trackObject({ dispose() { scene.remove(bgMesh); bgGeo.dispose(); bgMat.dispose(); } });

            const r = new GlyphRenderer(scene, atlas, { defaultColor: { r: 1, g: 1, b: 1 } });
            trackObject(r);
            r.render('Depth OK', { x: -16, y: -22.5, z: 0 });

            const mat = r.instanceMesh.material;
            assert(mat.depthWrite === true, `depthWrite=${mat.depthWrite}`);
            assert(mat.transparent === false, `transparent=${mat.transparent}`);

            log(`  depthWrite=${mat.depthWrite}, transparent=${mat.transparent}`, 'ok');
        });

        // -- 11: Mixed sync + async --
        defineTest('Mixed: sync + async coexist', async () => {
            const syncR = new GlyphRenderer(scene, atlas, { defaultColor: { r: 0, g: 1, b: 0 } });
            trackObject(syncR);
            const syncId = syncR.render('SYNC', { x: 15, y: -18, z: 0 });

            const asyncC = new GlyphCollection(scene, atlas, {
                defaultColor: { r: 1, g: 0.5, b: 0 },
                worldScale: 0.025
            });
            trackObject(asyncC);
            const asyncId = asyncC.addText('ASYNC', { x: 15, y: -20, z: 0 });
            await asyncC.flushAsync();

            // Both should be updatable
            syncR.updateColor(syncId, { r: 0, g: 1, b: 1 });
            asyncC.updateColor(asyncId, { r: 1, g: 1, b: 0 });
            asyncC.flush();

            log(`  sync + async both active and updatable`, 'ok');
        });

        // ============================================================
        // TEST RUNNER
        // ============================================================

        async function runAllTests() {
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = true;
            logEl.innerHTML = '';
            summaryEl.innerHTML = '';

            if (!atlas) {
                log('Generating glyph atlas...', 'info');
                atlas = new GlyphAtlas();
                await atlas.generate();
                log(`Atlas ready: ${atlas.getCharSize().width}x${atlas.getCharSize().height}px`, 'ok');
            }

            clearScene();

            let passed = 0, failed = 0;

            for (let i = 0; i < tests.length; i++) {
                updateTestStatus(i, 'running');
                log(`[${i + 1}/${tests.length}] ${tests[i].name}`);
                try {
                    await tests[i].fn();
                    updateTestStatus(i, 'pass');
                    testLog.info(`PASS: ${t.name}`);
                    passed++;
                } catch (err) {
                    updateTestStatus(i, 'fail');
                    log(`  FAIL: ${err.message}`, 'err');
                    // Log stack trace to help identify source of errors like "Can't find variable: t"
                    if (err.stack) {
                        const shortStack = err.stack.split('\n').slice(0, 5).join('\n  ');
                        log(`  STACK: ${shortStack}`, 'err');
                    }
                    testLog.error(`FAIL: ${tests[i].name}`, { error: err.message, stack: err.stack });
                    console.error(`Test "${tests[i].name}":`, err);
                    failed++;
                }
            }

            const cls = failed > 0 ? 'has-fail' : 'all-pass';
            summaryEl.innerHTML = `<div class="summary ${cls}">${passed} passed, ${failed} failed</div>`;
            log(`Done: ${passed}/${tests.length}`, failed > 0 ? 'err' : 'ok');
            runBtn.disabled = false;
        }

        // ============================================================
        // INIT
        // ============================================================

        renderTestList();

        // Panel collapse / expand
        const panel = document.getElementById('panel');
        const panelToggle = document.getElementById('panel-toggle');
        const panelCollapse = document.getElementById('panel-collapse');

        function setPanelCollapsed(collapsed) {
            panel.classList.toggle('collapsed', collapsed);
            panelToggle.classList.toggle('hidden', !collapsed);
        }

        panelCollapse.addEventListener('click', () => setPanelCollapsed(true));
        panelToggle.addEventListener('click', () => setPanelCollapsed(false));

        // Auto-collapse on small screens
        if (window.innerWidth <= 600) {
            setPanelCollapsed(true);
        }

        document.getElementById('run-btn').addEventListener('click', runAllTests);
        document.getElementById('clear-btn').addEventListener('click', () => {
            clearScene();
            tests.forEach((_, i) => updateTestStatus(i, 'pending'));
            summaryEl.innerHTML = '';
        });
        document.getElementById('download-logs-btn').addEventListener('click', () => {
            logCapture.download();
        });

        let lastTime = performance.now();
        let renderErrorLogged = false;
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            updateCamera((now - lastTime) / 1000);
            lastTime = now;
            try {
                renderer.render(scene, camera);
            } catch (renderErr) {
                if (!renderErrorLogged) {
                    renderErrorLogged = true;
                    log(`[RENDER ERROR] ${renderErr.message}`, 'err');
                    if (renderErr.stack) {
                        log(`  ${renderErr.stack.split('\n').slice(0, 3).join('\n  ')}`, 'err');
                    }
                }
            }
        }
        animate();

        // Auto-run
        runAllTests();
    </script>
</body>
