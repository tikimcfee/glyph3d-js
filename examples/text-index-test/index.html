<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Index Validation — glyph3d-js</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cousine', 'Consolas', monospace; background: #07080a; color: #cfd2d6; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; }
  #report {
    position: fixed; top: 0; right: 0; width: 400px; max-height: 100vh; overflow-y: auto;
    background: rgba(8,9,12,0.92); border-left: 1px solid #222; padding: 10px 12px;
    font-size: 10px; line-height: 1.4; z-index: 10; white-space: pre;
  }
  #report h1 { font-size: 13px; color: #6cf; margin-bottom: 6px; }
  .raw  { color: #6f6; }
  .vis  { color: #f3f; }
  .bad  { color: #f66; }
  .dim  { color: #777; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="report">booting...</div>

<script type="module">
import * as THREE from 'three';
import { GlyphAtlas, HarfBuzzShaper, SlugEncoder, collectUniqueGlyphIds } from '../../src/index.js';
import CodeGrid from '../../src/collections/CodeGrid.js';

const ATLAS_FONT = 'Cousine, monospace';
const ATLAS_FONT_SIZE = 48;
const ATLAS_SIZE = 1024;

// Load a real source file. We highlight each line's FIRST identifier token
// two ways and watch where each lands:
//   GREEN    = raw codepoint column  (what the builder actually indexes by)
//   MAGENTA  = "visible" column      (cp>32 skip — what getVisibleCharCount /
//                                      highlight.token compute and feed in)
// On indented lines the magenta slides LEFT by the indent depth.
const SOURCE = '/src/collections/CodeGrid.js';
const WINDOW = 20;          // lines to display
const HL_RAW = { r: 0.1, g: 1.0, b: 0.2 };
const HL_VIS = { r: 1.0, g: 0.0, b: 0.9 };

const report = document.getElementById('report');
function log(html) { report.innerHTML += html + '\n'; }

// Verbatim copy of the FIXED highlight.token handler logic. Highlights every
// occurrence of `token`, computing the column by codepoint index. If the fix
// is correct, every magenta wash lands exactly on an occurrence of the token,
// at any indentation depth.
function highlightTokenFixed(grid, lines, token, color) {
  const hits = [];
  for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
    const lineText = lines[lineIdx];
    let searchStart = 0;
    while (true) {
      const pos = lineText.indexOf(token, searchStart);
      if (pos === -1) break;
      const col = [...lineText.slice(0, pos)].length;
      const len = [...token].length;
      if (len > 0) {
        grid.highlightRange(lineIdx, col, lineIdx, col + len, color);
        hits.push({ line: lineIdx, col, len });
      }
      searchStart = pos + token.length;
    }
  }
  return hits;
}

async function boot() {
  const canvas = document.getElementById('canvas');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07080a);
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 10000);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Glyph engine - mirrors HomeShell._initGlyphEngine.
  const atlas = new GlyphAtlas(ATLAS_FONT, ATLAS_FONT_SIZE, ATLAS_SIZE);
  await atlas.generate();
  const fontUrl = new URL('../../src/fonts/Cousine-Regular.ttf', import.meta.url).href;
  const fontBuffer = await (await fetch(fontUrl)).arrayBuffer();
  const shaper = new HarfBuzzShaper();
  await shaper.init(fontBuffer);
  const { default: MonospaceShapeCache } = await import('../../src/shaping/MonospaceShapeCache.js');
  let probe = '';
  for (let cp = 0x20; cp <= 0x7E; cp++) probe += String.fromCodePoint(cp);
  for (let cp = 0xA0; cp <= 0xFF; cp++) probe += String.fromCodePoint(cp);
  const shapeCache = new MonospaceShapeCache(shaper);
  shapeCache.prime(probe);
  const { getWorkerBridge } = await import('../../src/workers/WorkerBridge.js');
  getWorkerBridge().setShaper(shaper, shapeCache);
  const probeText = Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i)).join('');
  const { shapeText } = await import('../../src/shaping/shapeText.js');
  const shaped = shapeText(shapeCache, probeText);
  atlas._slugData = new SlugEncoder(shaper).encode(collectUniqueGlyphIds(shaped.lines));
  atlas._shaper = shaper;

  // Fetch the real file and pick the most-indented WINDOW-line slice.
  const fileText = await (await fetch(SOURCE)).text();
  const allLines = fileText.split('\n');
  let bestStart = 0, bestScore = -1;
  for (let s = 0; s + WINDOW <= allLines.length; s++) {
    let score = 0;
    for (let i = s; i < s + WINDOW; i++) {
      const lead = allLines[i].match(/^[ \t]*/)[0].length;
      if (/[A-Za-z_$]/.test(allLines[i])) score += lead; // reward indented code, not blank lines
    }
    if (score > bestScore) { bestScore = score; bestStart = s; }
  }
  const lines = allLines.slice(bestStart, bestStart + WINDOW);
  const text = lines.join('\n');

  const grid = new CodeGrid(scene, atlas, {
    name: 'index-test', showBackground: false, showFilename: false,
    textColor: { r: 0.42, g: 0.45, b: 0.5 }, gridScale: 1.0, worldScale: 0.10,
  });
  await grid.loadTextAsync(text);
  scene.add(grid);

  // Pick a token that occurs on several (indented) lines in the window.
  const freq = new Map();
  for (const l of lines) for (const m of l.matchAll(/[A-Za-z_$][A-Za-z0-9_$]*/g)) {
    if (m[0].length >= 3) freq.set(m[0], (freq.get(m[0]) || 0) + 1);
  }
  const TOKEN = [...freq.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || 'this';

  // Run the FIXED token highlighter. Every hit should land on the token.
  const hits = highlightTokenFixed(grid, lines, TOKEN, HL_VIS);

  // Independent oracle: the codepoints the highlight actually covers must equal
  // the token. Handles multiple occurrences per line (each hit checked on its own).
  const tokLen = [...TOKEN].length;
  const checks = hits.map(h => {
    const arr = [...lines[h.line]];
    const at = arr.slice(h.col, h.col + tokLen).join('');
    return { line: h.line, col: h.col, at, ok: at === TOKEN };
  });
  const allOk = checks.every(c => c.ok);

  // Frame the whole block into the LEFT portion of the canvas (the report
  // panel covers the right ~40%). Fit by bounding box so it works at any
  // worldScale / line count, and pan the camera so the block lands on the left.
  const LEFT_FRAC = 0.70;   // block occupies this fraction of the width, from the left
  const MARGIN = 1.10;
  // grid.getBounds() returns real world-space content bounds — setFromObject
  // can't see our custom instancePosition attribute (it'd measure one quad).
  const box = grid.getBounds();
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  const tan = Math.tan((camera.fov * Math.PI / 180) / 2);
  const dV = (size.y * MARGIN) / (2 * tan);                                  // fit height
  const dH = (size.x * MARGIN) / (2 * tan * camera.aspect * LEFT_FRAC);      // fit width into left frac
  const d = Math.max(dV, dH);
  const viewW = 2 * d * tan * camera.aspect;
  const viewH = 2 * d * tan;
  const camX = center.x - (LEFT_FRAC - 1) * (viewW / 2);   // shift block left
  const camY = box.max.y - viewH / 2 + 0.05 * viewH;       // top-align with a small margin
  camera.position.set(camX, camY, center.z + d);
  camera.lookAt(camX, camY, center.z);
  renderer.render(scene, camera);

  log('<h1>token highlight — after fix</h1>');
  log(`<span class="dim">${SOURCE.split('/').pop()} L${bestStart}-${bestStart + WINDOW - 1}</span>`);
  log(`<span class="vis">magenta = highlight.token "${TOKEN}"</span>`);
  log(`hits: ${hits.length}  ` +
      (allOk ? '<span class="raw">all land correctly</span>' : '<span class="bad">MISMATCH</span>') + '\n');
  for (const h of hits) {
    const arr = [...lines[h.line]];
    const at = arr.slice(h.col, h.col + TOKEN.length).join('');
    const mark = at === TOKEN ? '<span class="raw">ok</span>' : '<span class="bad">!!</span>';
    log(`L${String(h.line).padStart(2)} col ${String(h.col).padStart(2)}  -> "${at}" ${mark}`);
  }

  window.__HARNESS = { ready: true, source: SOURCE, windowStart: bestStart, token: TOKEN, hits: hits.length, allOk, checks,
    frame: { size: size.toArray().map(n=>+n.toFixed(2)), center: center.toArray().map(n=>+n.toFixed(2)), d: +d.toFixed(2), bind: dH>dV?'width':'height' } };
  console.log('[harness]', JSON.stringify(window.__HARNESS, null, 2));
}

boot().catch(err => {
  report.innerHTML = '<span class="bad">BOOT FAILED: ' + (err && err.stack || err) + '</span>';
  window.__HARNESS = { ready: false, error: String(err && err.stack || err) };
  console.error(err);
});
</script>
</body>
</html>
