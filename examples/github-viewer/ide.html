<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>glyph3d IDE</title>
    <link rel="stylesheet" href="ide.css">
</head>
<body>
    <!-- ====== IDE Shell (CSS Grid root) ====== -->
    <div id="ide-shell">

        <!-- Row 1: Title Bar -->
        <header id="titlebar">
            <span class="titlebar-title">glyph3d</span>
            <span id="titlebar-repo-label" class="titlebar-info"></span>
            <span class="titlebar-spacer"></span>
        </header>

        <!-- Activity Bar: thin vertical icon strip -->
        <nav id="activity-bar">
            <button class="activity-btn active" data-panel="explorer" title="Explorer (files)">
                <span class="activity-icon">&#128193;</span>
            </button>
            <button class="activity-btn" data-panel="search" title="Search">
                <span class="activity-icon">&#128269;</span>
            </button>
            <button class="activity-btn" data-panel="repo" title="Repository">
                <span class="activity-icon">&#9881;</span>
            </button>
            <button class="activity-btn" data-panel="diff" title="Diff / Source Control">
                <span class="activity-icon">&#8644;</span>
            </button>
            <button class="activity-btn" data-panel="settings" title="Settings">
                <span class="activity-icon">&#9776;</span>
            </button>
            <div class="activity-spacer"></div>
            <!-- Bottom-pinned items -->
            <button class="activity-btn" data-panel="hand-tracking" title="Hand Tracking">
                <span class="activity-icon">&#9995;</span>
            </button>
            <button class="activity-btn" data-panel="controls" title="Keyboard Shortcuts">
                <span class="activity-icon">&#9000;</span>
            </button>
        </nav>

        <!-- Sidebar: shows the active panel -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <span id="sidebar-title">EXPLORER</span>
                <button id="sidebar-collapse-btn" class="icon-btn" title="Collapse sidebar">&#10094;</button>
            </div>
            <div id="sidebar-content">
                <!-- Explorer panel (file tree) -->
                <div class="sidebar-panel active" id="sp-explorer">
                    <div id="tree-content">
                        <div class="tree-empty">Load a repository to see files</div>
                    </div>
                </div>

                <!-- Search panel -->
                <div class="sidebar-panel" id="sp-search">
                    <div class="sidebar-search">
                        <input type="text" id="sidebar-search-input" class="sidebar-input"
                               placeholder="Search file names...">
                        <div id="sidebar-search-results" class="sidebar-results"></div>
                    </div>
                </div>

                <!-- Repo panel (URL input, branch, load) -->
                <div class="sidebar-panel" id="sp-repo"></div>

                <!-- Diff panel -->
                <div class="sidebar-panel" id="sp-diff"></div>

                <!-- Settings panel -->
                <div class="sidebar-panel" id="sp-settings"></div>

                <!-- Hand tracking panel -->
                <div class="sidebar-panel" id="sp-hand-tracking"></div>

                <!-- Controls / keyboard shortcuts panel -->
                <div class="sidebar-panel" id="sp-controls"></div>
            </div>
        </aside>

        <!-- Sidebar resize handle -->
        <div id="sidebar-resize"></div>

        <!-- Editor Column: tab bar + 3D canvas + bottom panel -->
        <div id="editor-column">

            <!-- Tab Bar: open files -->
            <div id="editor-tab-bar">
                <div id="tab-bar-empty" class="tab-bar-hint">No files open</div>
            </div>

            <!-- Breadcrumb bar -->
            <div id="breadcrumb-bar">
                <span id="breadcrumb-path" class="breadcrumb-text"></span>
            </div>

            <!-- 3D Canvas: THE editor area -->
            <div id="editor-area">
                <canvas id="canvas"></canvas>
                <!-- Minimap overlay -->
                <div id="minimap-container">
                    <canvas id="minimap-canvas"></canvas>
                </div>
                <!-- Command palette overlay -->
                <div id="command-palette" class="hidden">
                    <input type="text" id="palette-input" class="palette-input"
                           placeholder="Type a file name to open...">
                    <div id="palette-results" class="palette-results"></div>
                </div>
            </div>

            <!-- Bottom panel resize handle -->
            <div id="panel-resize"></div>

            <!-- Bottom Panel: output, console, search results, WebSocket -->
            <div id="bottom-panel">
                <div id="panel-tab-bar">
                    <button class="panel-tab active" data-panel="output">Output</button>
                    <button class="panel-tab" data-panel="console">Console</button>
                    <button class="panel-tab" data-panel="ws-log">WebSocket</button>
                    <div class="panel-tab-spacer"></div>
                    <button id="panel-close-btn" class="icon-btn" title="Close panel">&#10005;</button>
                </div>
                <div id="panel-content">
                    <div class="panel-view active" id="pv-output">
                        <!-- Stats output -->
                    </div>
                    <div class="panel-view" id="pv-console">
                        <!-- Log capture -->
                    </div>
                    <div class="panel-view" id="pv-ws-log">
                        <!-- WebSocket command I/O log -->
                        <div style="color: var(--text-secondary);">WebSocket command log appears here.</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Status Bar -->
        <footer id="status-bar">
            <div class="status-left">
                <span class="status-item" id="status-branch" title="Branch">
                    <span class="status-icon">&#9733;</span> main
                </span>
                <span class="status-item" id="status-layout" title="Layout mode">
                    hierarchical
                </span>
            </div>
            <div class="status-right">
                <span class="status-item" id="status-file-path" title="Focused file"></span>
                <span class="status-item" id="status-glyph-count" title="Glyph count">0 glyphs</span>
                <span class="status-item" id="status-grid-count" title="Grid count">0 grids</span>
                <span class="status-item" id="status-camera" title="Camera position">0, 0, 500</span>
                <span class="status-item status-fps" id="status-fps" title="FPS">-- fps</span>
                <span class="status-item status-ws" id="status-ws" title="WebSocket">WS: --</span>
            </div>
        </footer>

    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GitHubRepoViewer } from './GitHubRepoViewer.js';
        import { DrawerController } from './components/Drawer.js';
        import { IDEShell } from './IDEShell.js';
        import CommandBar from './components/CommandBar.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const canvas = document.getElementById('canvas');

            // Create the IDE shell orchestrator BEFORE the viewer,
            // so the viewer's init sees the correct DOM for sidebar panels.
            const ide = new IDEShell();

            // Inject sidebar panel HTML (uses the same builders as the old Drawer).
            // This puts repo, settings, controls, diff, hand-tracking, stats, and
            // log-capture HTML into the IDE shell sidebar and bottom panel zones.
            ide.injectPanelContent();

            // Create the viewer (renders into #editor-area canvas)
            const viewer = new GitHubRepoViewer(canvas, THREE);

            // Tell the IDE shell about the viewer so it can wire status updates.
            // This also hides old Drawer/header/FPS badge elements.
            ide.attachViewer(viewer);

            // Intercept the viewer's init() so that the DrawerController it
            // creates gets replaced with our IDE shell's drawer-compatible shim.
            // We wrap init() to replace this.drawer after the original runs.
            const origInit = viewer.init.bind(viewer);
            viewer.init = async function() {
                await origInit();

                // Replace the drawer that init() created with the IDE shell shim.
                // The original DrawerController appended DOM elements (toggle btn,
                // scrim, drawer panel) -- those are hidden by attachViewer().
                // Future calls like drawer.openToTab() now route to the IDE shell.
                viewer.drawer = ide.asDrawer();
            };

            // Override updateStats to also feed the IDE status bar
            const origUpdateStats = viewer.updateStats.bind(viewer);
            viewer.updateStats = function(deltaTime) {
                origUpdateStats(deltaTime);
                ide.updateStatusBar(deltaTime);
            };

            await viewer.init();

            // ---- Command Bar: unified input surface ----
            // The router and context are available after init().
            const router = viewer._commandRouter;
            const commandBar = new CommandBar({
                router,
                cameraController: viewer.cameraController,
                context: router.context,
            });
            commandBar.mount(document.getElementById('editor-column'));

            // Click-to-target: raycast against TerminalGrid backgrounds.
            // When a terminal's background mesh is clicked, auto-target the bar.
            // Click on empty space clears the target.
            {
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();
                const canvas = viewer.renderer.domElement;

                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(mouse, viewer.camera);

                    // Collect all terminal background meshes with their IDs
                    const terminals = router.context.terminals;
                    if (!terminals || terminals.size === 0) return;

                    const bgMeshes = [];
                    for (const [id, grid] of terminals) {
                        if (grid._background) {
                            grid._background._terminalId = id;
                            bgMeshes.push(grid._background);
                        }
                    }

                    const hits = raycaster.intersectObjects(bgMeshes, false);
                    if (hits.length > 0) {
                        const termId = hits[0].object._terminalId;
                        commandBar.setTarget(termId);
                        commandBar.focus();
                    } else {
                        // Clicked empty space — clear target if in terminal mode
                        commandBar.clearTarget();
                    }
                });
            }

            // After init: the viewer set window.addEventListener('resize') which
            // calls renderer.setSize(window.innerWidth, window.innerHeight).
            // In IDE mode the canvas is sized by ResizeObserver on #editor-area.
            // Add a resize listener that forces the IDE shell sizing path.
            window.addEventListener('resize', () => {
                ide._onEditorResize();
            });

            // Force initial resize to match editor-area (not window) dimensions
            ide._onEditorResize();

            // Post-init: start IDE shell (search wiring, log capture, etc.)
            ide.start();
        });
    </script>
</body>
</html>
