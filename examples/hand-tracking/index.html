<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Tracking — glyph3d</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="hud">
        <div id="status">Initializing...</div>
        <div id="gesture-info">&mdash;</div>
        <div id="controls">
            <button id="btn-mock" class="active">Mock</button>
            <button id="btn-webcam">Webcam</button>
            <button id="btn-ws">WebSocket</button>
            <button id="btn-perspective" class="toggle">1st Person</button>
        </div>
        <div id="help">
            WASD: move &nbsp; Q/E: up/down &nbsp; Click+drag: look (webcam/ws mode)
            <br>Mock mode: mouse = hand, Space = pinch
        </div>
    </div>

    <div id="tuning-panel">
        <div class="panel-header">Tuning</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "@glyph3d/core/": "/packages/glyph3d-core/src/"
        }
    }
    </script>

    <script type="module">
        import { HandTrackingApp } from './HandTrackingApp.js';
        import CONFIG from './config.js';

        const canvas = document.getElementById('canvas');
        const app = new HandTrackingApp(canvas, CONFIG);

        // Source selection — URL param overrides config
        const params = new URLSearchParams(window.location.search);
        const initialSource = params.get('source') || CONFIG.source;

        await app.init(initialSource);

        // Source switching buttons
        const buttons = {
            'btn-mock': 'mock',
            'btn-webcam': 'webcam',
            'btn-ws': 'websocket',
        };

        function setActiveButton(id) {
            document.querySelectorAll('#controls button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        for (const [btnId, source] of Object.entries(buttons)) {
            document.getElementById(btnId).addEventListener('click', async () => {
                setActiveButton(btnId);
                await app.init(source);
            });
        }

        const initialBtnId = Object.entries(buttons).find(([, s]) => s === initialSource)?.[0] || 'btn-mock';
        setActiveButton(initialBtnId);

        // Slider definitions: [configKey, label, setter]
        const sliders = [
            ['spread',     'Spread',      v => { app.handRenderer.spread = v; app.viewportRenderer.spread = v; }],
            ['depth',      'Depth',       v => { app.handRenderer.depth = v; app.viewportRenderer.depth = v; }],
            ['scale',      'Scale',       v => { app.handRenderer.scale = v; app.viewportRenderer.scale = v; }],
            ['refSpan',    'Ref Span',    v => { if (app.source?.referenceSpan !== undefined) app.source.referenceSpan = v; }],
            ['depthScale', 'Depth Scale', v => { if (app.source?.depthScale !== undefined) app.source.depthScale = v; }],
            ['boneRadius', 'Bone Radius', v => app.handRenderer.boneRadius = v],
            ['jointSize',  'Joint Size',  v => app.handRenderer.jointSize = v],
        ];

        // Build sliders from config
        const panel = document.getElementById('tuning-panel');
        for (const [key, label, setter] of sliders) {
            const value = CONFIG[key];
            const [min, max, step] = CONFIG.ranges[key];

            const lbl = document.createElement('label');
            lbl.innerHTML = `<span>${label} <span class="val">${value.toFixed(2)}</span></span>`;
            const input = document.createElement('input');
            Object.assign(input, { type: 'range', min, max, step, value });
            const valSpan = lbl.querySelector('.val');

            input.addEventListener('input', () => {
                const v = parseFloat(input.value);
                valSpan.textContent = v.toFixed(2);
                setter(v);
            });

            lbl.appendChild(input);
            panel.appendChild(lbl);
        }

        // Perspective toggle
        const perspBtn = document.getElementById('btn-perspective');
        let firstPerson = CONFIG.firstPerson;
        if (firstPerson) perspBtn.classList.add('active');

        perspBtn.addEventListener('click', () => {
            firstPerson = !firstPerson;
            perspBtn.textContent = firstPerson ? '1st Person' : 'Mirror';
            perspBtn.classList.toggle('active', firstPerson);
            if (app.source?.firstPerson !== undefined) {
                app.source.firstPerson = firstPerson;
            }
            // Persist so source switches remember the setting
            app.config.firstPerson = firstPerson;
        });
    </script>
</body>
</html>
