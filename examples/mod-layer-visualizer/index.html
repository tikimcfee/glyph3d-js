<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Layer Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls">
        <h1>MOD LAYER VIZ</h1>
        <p class="subtitle">
            Stacked modular arithmetic grids. Each layer colors
            your dataset by remainder mod N. Patterns reveal structure.
        </p>

        <!-- Dataset -->
        <h2>Dataset</h2>
        <div class="ctrl-row">
            <label>Source</label>
            <select id="dataset-select">
                <option value="primes">First N Primes</option>
                <option value="integers">Integers 1..N</option>
                <option value="fibonacci">Fibonacci Sequence</option>
                <option value="random">Random (0-9999)</option>
                <option value="collatz">Collatz Sequence</option>
                <option value="triangular">Triangular Numbers</option>
                <option value="text">UTF-8 Text Bytes</option>
            </select>
        </div>
        <div class="ctrl-row" id="n-row">
            <label>N <span class="val" id="n-val">256</span></label>
            <input type="range" id="n-slider" min="16" max="2048" value="256" step="1">
        </div>
        <div class="ctrl-row" id="text-row" style="display:none">
            <label>Input Text</label>
            <textarea id="text-input">The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. How vexingly quick daft zebras jump!</textarea>
        </div>

        <!-- Grid info -->
        <h2>Grid</h2>
        <div id="grid-info">--</div>

        <!-- Layers -->
        <h2>Layers</h2>
        <div class="ctrl-row">
            <label>Max Modulus <span class="val" id="mod-val">12</span></label>
            <input type="range" id="mod-slider" min="3" max="48" value="12" step="1">
        </div>
        <div class="ctrl-row">
            <label>Spacing <span class="val" id="spacing-val">1.00</span></label>
            <input type="range" id="spacing-slider" min="0" max="5" value="1.0" step="0.05">
        </div>
        <div class="ctrl-row">
            <label>Opacity <span class="val" id="opacity-val">0.85</span></label>
            <input type="range" id="opacity-slider" min="0.05" max="1.0" value="0.85" step="0.01">
        </div>

        <!-- Color -->
        <h2>Color Scheme</h2>
        <div class="ctrl-row">
            <select id="color-scheme"></select>
        </div>

        <!-- Toggles -->
        <h2>Layer Toggles</h2>
        <div id="layer-toggles"></div>

        <button id="rebuild-btn">REBUILD</button>
    </div>

    <div id="info">drag to rotate &middot; scroll to zoom &middot; right-drag to pan</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import ModLayerVisualizer, {
            AVAILABLE_COLOR_SCHEMES,
            getSchemeColor,
        } from './ModLayerVisualizer.js';
        import {
            generatePrimes,
            generateFibonacci,
            generateIntegers,
            generateRandom,
            generateCollatz,
            generateTriangular,
            textToBytes,
        } from './DataGenerators.js';

        // ----- DOM refs -----
        const $ = id => document.getElementById(id);
        const datasetSelect  = $('dataset-select');
        const nSlider        = $('n-slider');
        const nVal           = $('n-val');
        const nRow           = $('n-row');
        const textRow        = $('text-row');
        const textInput      = $('text-input');
        const gridInfo       = $('grid-info');
        const modSlider      = $('mod-slider');
        const modVal         = $('mod-val');
        const spacingSlider  = $('spacing-slider');
        const spacingVal     = $('spacing-val');
        const opacitySlider  = $('opacity-slider');
        const opacityVal     = $('opacity-val');
        const colorSelect    = $('color-scheme');
        const layerToggles   = $('layer-toggles');
        const rebuildBtn     = $('rebuild-btn');

        // ----- Populate color scheme dropdown -----
        for (const name of AVAILABLE_COLOR_SCHEMES) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name.charAt(0).toUpperCase() + name.slice(1);
            colorSelect.appendChild(opt);
        }

        // ----- Create visualizer -----
        const container = $('canvas-container');
        const viz = new ModLayerVisualizer(container, THREE);
        await viz.init();

        // ----- Data generation -----
        function getData() {
            const src = datasetSelect.value;
            const n = +nSlider.value;
            switch (src) {
                case 'primes':     return generatePrimes(n);
                case 'integers':   return generateIntegers(n);
                case 'fibonacci':  return generateFibonacci(n);
                case 'random':     return generateRandom(n);
                case 'collatz':    return generateCollatz(n);
                case 'triangular': return generateTriangular(n);
                case 'text':       return textToBytes(textInput.value);
                default:           return generateIntegers(n);
            }
        }

        // ----- Build / rebuild -----
        function rebuild() {
            const data = getData();
            viz.setData(data);
            const { cols, rows, layers } = viz.build({
                minMod: 2,
                maxMod: +modSlider.value,
                colorScheme: colorSelect.value,
            });

            // Update grid info
            gridInfo.textContent =
                `${cols} \u00d7 ${rows}  (${data.length} values, ${cols * rows} cells)`;

            // Rebuild layer toggles
            layerToggles.innerHTML = '';
            for (const { mod, swatchColor } of layers) {
                const row = document.createElement('label');
                row.className = 'layer-toggle';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = true;
                cb.addEventListener('change', () => viz.setLayerVisible(mod, cb.checked));

                const swatch = document.createElement('div');
                swatch.className = 'layer-swatch';
                swatch.style.background = swatchColor;

                const label = document.createElement('span');
                label.textContent = `mod ${mod}`;

                row.append(cb, swatch, label);
                layerToggles.appendChild(row);
            }
        }

        // ----- Wire up controls -----

        // Dataset selector — toggle N vs. text controls
        datasetSelect.addEventListener('change', () => {
            const isText = datasetSelect.value === 'text';
            nRow.style.display = isText ? 'none' : '';
            textRow.style.display = isText ? '' : 'none';
            rebuild();
        });

        // N slider — show value on drag, rebuild on release
        nSlider.addEventListener('input', () => {
            nVal.textContent = nSlider.value;
        });
        nSlider.addEventListener('change', rebuild);

        // Text input — rebuild on change
        textInput.addEventListener('change', rebuild);

        // Max modulus — show value on drag, rebuild on release
        modSlider.addEventListener('input', () => {
            modVal.textContent = modSlider.value;
        });
        modSlider.addEventListener('change', rebuild);

        // Spacing — live adjustment, no rebuild
        spacingSlider.addEventListener('input', () => {
            const s = +spacingSlider.value;
            spacingVal.textContent = s.toFixed(2);
            viz.setSpacing(s);
        });

        // Opacity — live adjustment, no rebuild
        opacitySlider.addEventListener('input', () => {
            const o = +opacitySlider.value;
            opacityVal.textContent = o.toFixed(2);
            viz.setOpacity(o);
        });

        // Color scheme — rebuild to re-color all layers
        colorSelect.addEventListener('change', rebuild);

        // Rebuild button — full reset
        rebuildBtn.addEventListener('click', rebuild);

        // ----- Initial build -----
        rebuild();
    </script>
</body>
</html>
