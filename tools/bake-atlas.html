<!DOCTYPE html>

    label { display: block; margin: 0.5rem 0 0.2rem; font-size: 0.9rem; color: #aaa; }
    input, select { background: #16213e; color: #e0e0e0; border: 1px solid #333; padding: 0.4rem; border-radius: 4px; }
    select { width: 320px; }
    button { background: #0f3460; color: #e0e0e0; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; margin-top: 1rem; font-size: 1rem; }
    button:hover { background: #1a5276; }
    button:disabled { opacity: 0.4; cursor: default; }
    #status { margin-top: 1rem; font-size: 0.9rem; white-space: pre-wrap; color: #7ec8e3; }
    #preview { margin-top: 1rem; max-width: 100%; border: 1px solid #333; image-rendering: pixelated; }
    .row { display: flex; gap: 1rem; align-items: end; flex-wrap: wrap; }
    .font-preview { font-size: 14px; color: #888; margin-top: 0.2rem; }
    #fontSample { display: inline-block; margin-left: 0.5rem; color: #e0e0e0; }

    /* Charset groups */
    .charset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.5rem 0; }
    .charset-group { background: #16213e; border: 1px solid #333; border-radius: 6px; padding: 0.6rem 0.8rem; }
    .charset-group label { display: flex; align-items: center; gap: 0.5rem; margin: 0; cursor: pointer; font-size: 0.9rem; color: #e0e0e0; }
    .charset-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0f3460; }
    .charset-count { font-size: 0.75rem; color: #666; margin-left: auto; }
    .charset-preview { font-size: 0.8rem; color: #7ec8e3; margin-top: 0.3rem; word-break: break-all; line-height: 1.4; max-height: 2.4em; overflow: hidden; }
    .charset-group.edge-case { border-color: #5a3; }
    .charset-group.edge-case .charset-preview { color: #8d8; }
    #totalCount { font-size: 0.85rem; color: #aaa; margin-top: 0.3rem; }
</style>
</head>
<body>
<h1>Bake Glyph Atlas</h1>
<p>Generates a pre-baked atlas PNG + JSON descriptor. No build tools required.</p>

<div class="row">
    <div>
        <label for="size">Atlas size (px) <span id="gpuLimit" style="font-size:0.75rem;color:#666"></span></label>
        <select id="size"></select>
    </div>
    <div>
        <label for="fontSize">Font size (px)</label>
        <input id="fontSize" type="number" value="48" min="8" max="128" style="width:80px">
    </div>
</div>

<div style="margin-top: 0.5rem">
    <label for="font">Font</label>
    <select id="font" style="width:420px"></select>
    <div class="font-preview">
        Sample: <span id="fontSample">AaBbCc 0123 {}[]() => // #include</span>
    </div>
</div>

<h2>Character Sets</h2>
<div style="margin-bottom: 0.3rem; font-size: 0.85rem; color: #888;">
    Base charset (ASCII, Latin-1, box drawing, arrows, common symbols) is always included.
    <span id="totalCount"></span>
</div>
<div class="charset-grid" id="charsetGrid"></div>

<button id="bake">Bake Atlas</button>
<div id="status"></div>
<canvas id="preview" style="display:none"></canvas>

const bakeBtn = document.getElementById('bake');
const fontSelect = document.getElementById('font');
const fontSample = document.getElementById('fontSample');
const charsetGrid = document.getElementById('charsetGrid');
const totalCountEl = document.getElementById('totalCount');

function log(msg) { statusEl.textContent += msg + '\n'; }

// ---- GPU max texture size detection ----
const sizeSelect = document.getElementById('size');
const gpuLimitEl = document.getElementById('gpuLimit');

{
    const gl = document.createElement('canvas').getContext('webgl2')
        || document.createElement('canvas').getContext('webgl');
    const maxSize = gl ? gl.getParameter(gl.MAX_TEXTURE_SIZE) : 4096;
    const renderer = gl?.getExtension('WEBGL_debug_renderer_info');
    const gpu = renderer ? gl.getParameter(renderer.UNMASKED_RENDERER_WEBGL) : 'unknown';
    gpuLimitEl.textContent = `(GPU max: ${maxSize}, ${gpu})`;

    const sizes = [512, 1024, 2048, 4096, 8192, 16384];
    for (const s of sizes) {
        if (s > maxSize) break;
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        if (s === 2048) opt.selected = true;
        sizeSelect.appendChild(opt);
    }
}

// Groups with `graphemes` use ensureGraphemes() (multi-codepoint support).
// Groups with `ranges` get appended to the charset before generate().

function range(start, end) {
    const out = [];
    for (let i = start; i <= end; i++) out.push(i);

// ---- Build charset UI ----

function buildCharsetUI() {
    charsetGrid.innerHTML = '';
    for (const group of CHARSET_GROUPS) {
        const div = document.createElement('div');
        div.className = 'charset-group' + (group.edgeCase ? ' edge-case' : '');
        const count = group.graphemes
            ? group.graphemes.length
            : group.ranges.reduce((sum, r) => sum + (Array.isArray(r) && typeof r[0] === 'number' && r.length > 2 ? r.length : (r[r.length-1] ?? r) - (r[0] ?? r) + 1), 0);
        div.innerHTML = `
            <label>
                <input type="checkbox" data-group="${group.id}" ${group.checked ? 'checked' : ''}>
                ${group.label}
                <span class="charset-count">${count}</span>
            </label>
            <div class="charset-preview">${group.preview}</div>
        `;
        charsetGrid.appendChild(div);
    }
    updateTotalCount();
}

function getGroupGlyphCount(group) {
    if (group.graphemes) return group.graphemes.length;
    let count = 0;
    for (const r of group.ranges) {
        if (Array.isArray(r) && r.length > 2) {
            count += r.length; // explicit list of codepoints
        } else if (Array.isArray(r)) {
            count += r.length; // range() output
        }
    }
    return count;
}

function updateTotalCount() {
    // Base charset is ~483
    let total = 483;
    for (const group of CHARSET_GROUPS) {
        const cb = charsetGrid.querySelector(`[data-group="${group.id}"]`);
        if (cb?.checked) total += getGroupGlyphCount(group);
    }
    totalCountEl.textContent = `Estimated total: ~${total} glyphs`;
}

charsetGrid.addEventListener('change', updateTotalCount);
buildCharsetUI();

// ---- Collect selected extra characters ----

function getSelectedExtras() {
    const extraCodepoints = [];
    const extraGraphemes = [];

    for (const group of CHARSET_GROUPS) {
        const cb = charsetGrid.querySelector(`[data-group="${group.id}"]`);
        if (!cb?.checked) continue;

        if (group.graphemes) {
            extraGraphemes.push(...group.graphemes);
        } else {
            for (const r of group.ranges) {
                if (Array.isArray(r)) {
                    extraCodepoints.push(...r);
                }
            }
        }
    }

    return { extraCodepoints, extraGraphemes };
}


// ---- Font enumeration ----

async function enumerateFonts() {
    const fonts = [];

    if ('queryLocalFonts' in window) {
        try {
            const localFonts = await window.queryLocalFonts();
            const families = new Set();
            for (const font of localFonts) {
                families.add(font.family);
            }
            for (const family of [...families].sort()) {
                fonts.push({ family, source: 'local', monospace: isMonospace(family) });
            }
            return fonts;
        } catch (e) {
            // Permission denied or API unavailable — fall through to probing
        }
    }

    const candidates = [
        'Monaco', 'Menlo', 'Consolas', 'Courier New', 'Courier',
        'SF Mono', 'Fira Code', 'Fira Mono', 'JetBrains Mono',
        'Source Code Pro', 'IBM Plex Mono', 'Roboto Mono',
        'Ubuntu Mono', 'Hack', 'Inconsolata', 'Cascadia Code',
        'Cascadia Mono', 'DejaVu Sans Mono', 'Liberation Mono',
        'Droid Sans Mono', 'Anonymous Pro', 'PT Mono',
        'Noto Sans Mono', 'Input Mono', 'Iosevka', 'Victor Mono',
        'Berkeley Mono', 'Geist Mono', 'Monaspace Neon',
        'Monaspace Argon', 'Monaspace Xenon', 'Monaspace Radon',
        'Monaspace Krypton', 'Commit Mono', 'Intel One Mono',
        'Arial', 'Helvetica', 'Helvetica Neue', 'Verdana', 'Georgia',
        'Times New Roman', 'Trebuchet MS', 'Tahoma', 'Segoe UI',
        'San Francisco', 'SF Pro', 'Inter', 'Roboto', 'Noto Sans',
        'Open Sans', 'Lato', 'Ubuntu', 'System UI',
    ];

    for (const family of candidates) {
        if (isFontAvailable(family)) {
            fonts.push({ family, source: 'probe', monospace: isMonospace(family) });
        }
    }

    return fonts;
}

function isFontAvailable(family) {
    const testStr = 'mmmmmmmmmmlli|W@#';
    const size = 72;
    const c = document.createElement('canvas');
    c.width = 600; c.height = 100;
    const ctx = c.getContext('2d');

    function measure(font) {
        ctx.font = `${size}px ${font}`;
        return ctx.measureText(testStr).width;
    }

    const serifW = measure('serif');
    const sansW = measure('sans-serif');
    const testW = measure(`"${family}", serif`);
    const testW2 = measure(`"${family}", sans-serif`);

    return testW !== serifW || testW2 !== sansW;
}

function isMonospace(family) {
    const c = document.createElement('canvas');
    c.width = 200; c.height = 50;
    const ctx = c.getContext('2d');
    ctx.font = `48px "${family}", serif`;
    const iW = ctx.measureText('i').width;
    const mW = ctx.measureText('m').width;
    return Math.abs(iW - mW) < 1;
}

async function populateFontSelect() {
    fontSelect.innerHTML = '<option value="">Loading fonts...</option>';
    const fonts = await enumerateFonts();

    fontSelect.innerHTML = '';

    const monoFonts = fonts.filter(f => f.monospace);
    const otherFonts = fonts.filter(f => !f.monospace);

    if (monoFonts.length > 0) {
        const group = document.createElement('optgroup');
        group.label = `Monospace (${monoFonts.length})`;
        for (const f of monoFonts) {
            const opt = document.createElement('option');
            opt.value = f.family;
            opt.textContent = f.family;
            opt.style.fontFamily = `"${f.family}", monospace`;
            group.appendChild(opt);
        }
        fontSelect.appendChild(group);
    }

    if (otherFonts.length > 0) {
        const group = document.createElement('optgroup');
        group.label = `Other (${otherFonts.length})`;
        for (const f of otherFonts) {
            const opt = document.createElement('option');
            opt.value = f.family;
            opt.textContent = f.family;
            opt.style.fontFamily = `"${f.family}", sans-serif`;
            group.appendChild(opt);
        }
        fontSelect.appendChild(group);
    }

    if (monoFonts.length > 0) {
        fontSelect.value = monoFonts[0].family;
    }
    updateFontPreview();
}

function updateFontPreview() {
    const family = fontSelect.value;
    fontSample.style.fontFamily = `"${family}", monospace`;
}

fontSelect.addEventListener('change', updateFontPreview);
populateFontSelect();

// ---- Bake ----

bakeBtn.addEventListener('click', async () => {
    bakeBtn.disabled = true;
    statusEl.textContent = '';
    previewEl.style.display = 'none';

    const size = parseInt(document.getElementById('size').value);
    const fontSize = parseInt(document.getElementById('fontSize').value);
    const fontFamily = fontSelect.value;

    if (!fontFamily) {
        log('ERROR: No font selected');
        bakeBtn.disabled = false;
        return;
    }

    const fontSlug = fontFamily.toLowerCase().replace(/\s+/g, '-');
    const prefix = `atlas-${fontSlug}-${size}`;

    const { extraCodepoints, extraGraphemes } = getSelectedExtras();

    log(`Font: ${fontFamily}`);
    log(`Extras: ${extraCodepoints.length} codepoints + ${extraGraphemes.length} graphemes from ${
        CHARSET_GROUPS.filter(g => charsetGrid.querySelector(`[data-group="${g.id}"]`)?.checked).map(g => g.label).join(', ') || 'none'
    }`);
    log(`Generating ${size}x${size} atlas (${fontSize}px)...`);

    try {
        const atlas = new GlyphAtlas(fontFamily, fontSize, size);

        // Inject extra single-codepoint characters into the charset before generate()
        if (extraCodepoints.length > 0) {
            const existing = new Set(atlas.charset);
            for (const cp of extraCodepoints) {
                if (!existing.has(cp)) {
                    atlas.charset.push(cp);
                    existing.add(cp);
                }
            }
            log(`Charset expanded to ${atlas.charset.length} codepoints`);
        }

        const t0 = performance.now();
        await atlas.generate((done, total) => {
            const pct = Math.floor((done / total) * 100);
            statusEl.textContent = statusEl.textContent.replace(/(Generating|Expanding).*/,
                `Generating... ${pct}% (${done}/${total})`);
        });

        // Add multi-codepoint graphemes via ensureGraphemes() (ZWJ, flags, combining, etc.)
        if (extraGraphemes.length > 0) {
            statusEl.textContent = statusEl.textContent.replace(/(Generating|Expanding).*/,
                `Expanding with ${extraGraphemes.length} graphemes...`);
            const added = atlas.ensureGraphemes(extraGraphemes);
            log(`ensureGraphemes: ${added} new glyphs added`);
        }

        const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
        const stats = atlas.getPackingStats();
        log(`Done in ${elapsed}s: ${stats.glyphCount} glyphs, ${stats.usedPercent}% atlas used`);

        if (parseFloat(stats.usedPercent) > 90) {
            log(`WARNING: Atlas is ${stats.usedPercent}% full. Consider a larger size.`);
        }

        log('Exporting...');
        const { image: dataUrl, descriptor } = atlas.exportAtlas();

        descriptor.resolvedFont = fontFamily;
        descriptor.charsetGroups = CHARSET_GROUPS
            .filter(g => charsetGrid.querySelector(`[data-group="${g.id}"]`)?.checked)
            .map(g => g.id);

        // Show preview
        const img = new Image();
        img.onload = () => {
            previewEl.width = Math.min(size, 512);
            previewEl.height = Math.min(size, 512);
            const ctx = previewEl.getContext('2d');
            ctx.drawImage(img, 0, 0, previewEl.width, previewEl.height);
            previewEl.style.display = 'block';
        };
        img.src = dataUrl;

        // Download PNG
        const pngBlob = await (await fetch(dataUrl)).blob();
        downloadBlob(pngBlob, `${prefix}.png`);
        log(`${prefix}.png (${(pngBlob.size / 1024).toFixed(1)} KB)`);

        // Download JSON
        const jsonStr = JSON.stringify(descriptor, null, 2);
        const jsonBlob = new Blob([jsonStr], { type: 'application/json' });
        downloadBlob(jsonBlob, `${prefix}.json`);
        log(`${prefix}.json (${(jsonBlob.size / 1024).toFixed(1)} KB)`);

        log(`\nFiles downloaded. Load with:`);
        log(`  loadPrebakedAtlas('/assets/${prefix}.png', '/assets/${prefix}.json')`);

    } catch (e) {
        log(`ERROR: ${e.message}\n${e.stack}`);
    } finally {
        bakeBtn.disabled = false;
    }
});

function downloadBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
}
