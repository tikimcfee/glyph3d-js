# The Rust side of glyph3d: the terminal daemon and its clients.
# Design and protocol: docs/termd/DESIGN.md, docs/termd/PROTOCOL.md.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# libghostty-rs needs 1.96.
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
g3d-wire = { path = "crates/g3d-wire" }

# Pinned to the libghostty-rs commit that tracks libghostty-vt 1.0.1 (Ghostty tag
# vt-1.0.1). The Ghostty source itself comes from the verified release tarballs via
# GHOSTTY_SOURCE_DIR / GHOSTTY_ZIG_SYSTEM_DIR, never a build-time git fetch
# (DESIGN.md, "Build and vendoring").
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "cd4d497e8c698b27054a677ce19d1bd1a1a4d8bf" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustix = { version = "1.1.6", features = ["pty", "termios", "process", "fs", "net", "event", "pipe", "stdio"] }
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "macros", "time", "signal"] }
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
# The daemon holds every shell; keep panics catchable per owner thread.
panic = "unwind"
